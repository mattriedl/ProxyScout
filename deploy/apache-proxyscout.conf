# Apache reverse proxy for ProxyScout. Replace proxies.example.com and the certificate paths.
<VirtualHost *:80>
    ServerName proxies.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName proxies.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/proxies.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/proxies.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 600

    # Live progress stream: don't buffer
    ProxyPass        /api/events http://127.0.0.1:8787/api/events flushpackets=on
    ProxyPassReverse /api/events http://127.0.0.1:8787/api/events

    ProxyPass        / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
</VirtualHost>
